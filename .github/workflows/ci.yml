name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # node --experimental-strip-types requires Node 22.6+ — tests are skipped on Node 20.
      # Typecheck above still validates TS correctness on both versions.
      - name: Unit tests
        if: startsWith(matrix.node-version, '22')
        run: pnpm test:unit

      - name: Integration tests
        if: startsWith(matrix.node-version, '22')
        run: pnpm test:integration

      # Playwright UI tests drive a live Electron app — not runnable on headless CI.
      # Run locally with: pnpm test:ui
